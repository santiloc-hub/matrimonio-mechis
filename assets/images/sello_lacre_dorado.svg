<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%">
  <defs>
    <!-- Degradados metálicos de oro y cera -->
    <radialGradient id="waxBase" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="25%" stop-color="#dfb15b"/>
      <stop offset="55%" stop-color="#b8832a"/>
      <stop offset="85%" stop-color="#7a5011"/>
      <stop offset="100%" stop-color="#4e3105"/>
    </radialGradient>

    <radialGradient id="waxInner" cx="42%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fff1c4"/>
      <stop offset="35%" stop-color="#cca043"/>
      <stop offset="70%" stop-color="#996a17"/>
      <stop offset="100%" stop-color="#613e05"/>
    </radialGradient>

    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff6d1"/>
      <stop offset="30%" stop-color="#dfb45f"/>
      <stop offset="70%" stop-color="#8a5e16"/>
      <stop offset="100%" stop-color="#ffd984"/>
    </linearGradient>

    <filter id="waxShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2d1a04" flood-opacity="0.5"/>
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <filter id="innerBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="-2" dy="-2" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.6"/>
      <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#3d2203" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Borde irregular orgánico de cera fundida -->
  <g filter="url(#waxShadow)">
    <path d="M150,15 
             C175,12 205,25 228,42 
             C252,60 278,82 284,112 
             C290,142 278,175 268,202 
             C257,230 236,256 208,272 
             C180,288 145,285 118,280 
             C90,275 62,260 42,238 
             C22,216 12,185 15,155 
             C18,125 32,96 52,72 
             C72,48 100,28 128,18 Z" 
          fill="url(#waxBase)" />

    <!-- Reborde circular exterior -->
    <circle cx="150" cy="150" r="108" fill="none" stroke="url(#goldRim)" stroke-width="7" filter="url(#innerBevel)"/>
    
    <!-- Relieve de cuentas / perlas doradas -->
    <circle cx="150" cy="150" r="95" fill="none" stroke="rgba(255,245,215,0.4)" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- Centro hundido del sello -->
    <circle cx="150" cy="150" r="86" fill="url(#waxInner)"/>

    <!-- Rama floral grabada superior e inferior -->
    <path d="M98,150 Q110,120 150,118 Q190,120 202,150 Q190,180 150,182 Q110,180 98,150" 
          fill="none" stroke="rgba(255,245,210,0.3)" stroke-width="1.5"/>

    <!-- Monograma grabado M & B -->
    <text x="150" y="162" 
          text-anchor="middle" 
          font-family="'Great Vibes', 'Brush Script MT', cursive" 
          font-size="62" 
          font-weight="bold" 
          fill="#442a04" 
          filter="url(#innerBevel)"
          letter-spacing="2">M&amp;B</text>

    <!-- Corazón pequeño grabado -->
    <path d="M150,182 C146,177 140,177 138,181 C135,185 137,189 150,198 C163,189 165,185 162,181 C160,177 154,177 150,182 Z" 
          fill="#5a3806"/>
  </g>
</svg>
